<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Lomba Gebyar HUT RI ke-81 SDIT AL-IQRA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary-teal: #1e5b5e;
      --secondary-gold: #e0b034;
      --accent-red: #ce1126;
    }
    .bg-teal-iqra { background-color: var(--primary-teal); }
    .text-teal-iqra { color: var(--primary-teal); }
    .bg-gold-iqra { background-color: var(--secondary-gold); }
    .border-gold-iqra { border-color: var(--secondary-gold); }
  </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

  <!-- Header Banner -->
  <header class="bg-teal-iqra text-white border-b-4 border-gold-iqra shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-6 text-center">
      <div class="inline-block bg-white p-2 rounded-full mb-3 shadow">
        <!-- Badge HUT RI -->
        <span class="bg-red-600 text-white font-bold text-xs px-3 py-1 rounded-full uppercase tracking-wider">HUT RI Ke-81</span>
      </div>
      <h1 class="text-2xl md:text-4xl font-extrabold tracking-wide">SDIT AL-IQRA TIRTAMULYA</h1>
      <p class="text-yellow-300 font-medium mt-1">Formulir Pendaftaran Semarak Lomba Kemerdekaan</p>
    </div>
  </header>

  <!-- Container -->
  <main class="max-w-2xl mx-auto p-4 my-6">
    <div class="bg-white rounded-xl shadow-md border border-slate-200 p-6 md:p-8">
      
      <!-- Alert Box -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-lg text-sm font-semibold"></div>

      <form id="registrationForm" onsubmit="handleSubmit(event)" class="space-y-5">
        
        <!-- Pilih Fase & Rombel -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Pilih Fase</label>
            <select id="faseSelect" onchange="handleFaseChange()" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-600 outline-none">
              <option value="">-- Pilih Fase --</option>
              <option value="Fase A">Fase A (Kelas 1-2)</option>
              <option value="Fase B">Fase B (Kelas 3-4)</option>
              <option value="Fase C">Fase C (Kelas 5-6)</option>
            </select>
          </div>

          <div>
            <label class="block text-sm font-bold text-slate-700 mb-1">Pilih Rombel / Kelas</label>
            <select id="rombelSelect" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-600 outline-none">
              <option value="">-- Pilih Rombel --</option>
            </select>
          </div>
        </div>

        <!-- Pilih Lomba -->
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1">Pilih Jenis Lomba</label>
          <select id="lombaSelect" onchange="handleLombaChange()" required disabled class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-teal-600 outline-none bg-slate-100">
            <option value="">-- Pilih Fase Terlebih Dahulu --</option>
          </select>
        </div>

        <!-- Dynamic Inputs (Tim / Individu) -->
        <div id="dynamicFields" class="space-y-4 pt-2"></div>

        <!-- Submit Button -->
        <button type="submit" id="submitBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg shadow-md hover:shadow-lg transition duration-200">
          Daftarkan Peserta
        </button>
      </form>
    </div>
  </main>

  <script>
    // **GANTI DENGAN URL DEPLOYMENT GAS ANDA**
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjZuzw3VXus__vyWtwgh_WBZX_ON1HvBfESyHMEteyw2P1vhc_fvtHZA6I5iiArb9Y/exec";

    const classOptions = {
      'Fase A': ['Kelas 1A', 'Kelas 1B', 'Kelas 2A', 'Kelas 2B'],
      'Fase B': ['Kelas 3A', 'Kelas 3B', 'Kelas 4A', 'Kelas 4B'],
      'Fase C': ['Kelas 5A', 'Kelas 5B', 'Kelas 6A', 'Kelas 6B']
    };

    let masterLomba = [];

    // Fetch Master Lomba saat Load
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch(`${GAS_WEB_APP_URL}?action=getLomba`);
        masterLomba = await res.json();
      } catch (err) {
        showAlert('Gagal memuat data lomba. Pastikan URL GAS benar.', 'error');
      }
    });

    function handleFaseChange() {
      const fase = document.getElementById('faseSelect').value;
      const rombelSelect = document.getElementById('rombelSelect');
      const lombaSelect = document.getElementById('lombaSelect');
      
      rombelSelect.innerHTML = '<option value="">-- Pilih Rombel --</option>';
      lombaSelect.innerHTML = '<option value="">-- Pilih Lomba --</option>';
      document.getElementById('dynamicFields').innerHTML = '';

      if (!fase) {
        lombaSelect.disabled = true;
        lombaSelect.classList.add('bg-slate-100');
        return;
      }

      // Populate Rombel
      classOptions[fase].forEach(r => {
        rombelSelect.innerHTML += `<option value="${r}">${r}</option>`;
      });

      // Filter & Populate Lomba berdasarkan Fase
      const availableLomba = masterLomba.filter(l => l.fase.includes(fase));
      availableLomba.forEach(l => {
        lombaSelect.innerHTML += `<option value="${l.id}">${l.nama} (${l.kategori})</option>`;
      });

      lombaSelect.disabled = false;
      lombaSelect.classList.remove('bg-slate-100');
    }

    function handleLombaChange() {
      const lombaId = document.getElementById('lombaSelect').value;
      const dynamicFields = document.getElementById('dynamicFields');
      dynamicFields.innerHTML = '';

      if (!lombaId) return;

      const selectedLomba = masterLomba.find(l => l.id === lombaId);

      if (selectedLomba.isTim) {
        let inputs = `
          <div>
            <label class="block text-sm font-semibold text-slate-700">Nama Tim / Kelompok</label>
            <input type="text" id="namaTim" required class="w-full p-2.5 border rounded-lg mt-1 outline-none focus:ring-2 focus:ring-teal-600" placeholder="Contoh: Tim Garuda 1">
          </div>
          <div class="space-y-2">
            <label class="block text-sm font-semibold text-slate-700">Nama Anggota Tim (Maks ${selectedLomba.maxPerTim} Orang)</label>`;
        
        for (let i = 1; i <= selectedLomba.maxPerTim; i++) {
          inputs += `<input type="text" class="anggotaInput w-full p-2 border rounded-lg text-sm" placeholder="Nama Anggota ${i}" ${i === 1 ? 'required' : ''}>`;
        }
        inputs += `</div>`;
        dynamicFields.innerHTML = inputs;
      } else {
        dynamicFields.innerHTML = `
          <div>
            <label class="block text-sm font-semibold text-slate-700">Nama Lengkap Peserta</label>
            <input type="text" id="namaPeserta" required class="w-full p-2.5 border rounded-lg mt-1 outline-none focus:ring-2 focus:ring-teal-600" placeholder="Masukkan nama siswa">
          </div>`;
      }
    }

    async function handleSubmit(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Memproses...';

      const fase = document.getElementById('faseSelect').value;
      const rombel = document.getElementById('rombelSelect').value;
      const lombaId = document.getElementById('lombaSelect').value;
      const selectedLomba = masterLomba.find(l => l.id === lombaId);

      let payload = { fase, rombel, lombaId };

      if (selectedLomba.isTim) {
        payload.namaTim = document.getElementById('namaTim').value;
        payload.anggota = Array.from(document.querySelectorAll('.anggotaInput'))
                               .map(i => i.value.trim())
                               .filter(val => val !== '');
      } else {
        payload.namaPeserta = document.getElementById('namaPeserta').value;
      }

      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.status === 'success') {
          showAlert(result.message, 'success');
          document.getElementById('registrationForm').reset();
          document.getElementById('dynamicFields').innerHTML = '';
        } else if (result.status === 'full') {
          showAlert(result.message, 'warning');
        } else {
          showAlert(result.message, 'error');
        }
      } catch (err) {
        showAlert('Terjadi kesalahan jaringan.', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Daftarkan Peserta';
      }
    }

    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.classList.remove('hidden', 'bg-red-100', 'text-red-700', 'bg-green-100', 'text-green-700', 'bg-yellow-100', 'text-yellow-800');
      
      if (type === 'success') box.classList.add('bg-green-100', 'text-green-700');
      else if (type === 'warning') box.classList.add('bg-yellow-100', 'text-yellow-800');
      else box.classList.add('bg-red-100', 'text-red-700');

      box.innerText = msg;
    }
  </script>
</body>
</html>
